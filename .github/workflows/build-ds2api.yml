name: Build ds2api ARM64

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install dependencies
        run: go mod tidy

      - name: Build ds2api (linux arm64)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o ds2api ./cmd/ds2api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ds2api-bin
          path: ds2api